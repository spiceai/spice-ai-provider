version: v1
kind: Spicepod
name: spice-sample

datasets:
  - from: github:github.com/vercel/ai/files/main
    name: vercel_ai_docs
    description: |
      This dataset contains docs from Vercel AI SDK repository.
    params:
      github_token: ${secrets:GITHUB_TOKEN}
      include: "content/docs/**/*.mdx"
    acceleration:
      enabled: true
    embeddings:
    - column: content
      use: openai_embeddings

embeddings:
  - from: openai
    name: openai_embeddings
    params:
      openai_api_key: ${secrets:openai_api_key}

models:
  - from: openai:gpt-4o
    name: gpt-4o
    params:
      openai_api_key: ${ secrets:OPENAI_API_KEY }
      tools: auto
      
  - from: openai:o1
    name: o1
    params:
      openai_api_key: ${ secrets:OPENAI_API_KEY }
      
  - from: openai:o1-preview
    name: o1-preview
    params:
      openai_api_key: ${ secrets:OPENAI_API_KEY }
      
  - from: openai:o1-mini
    name: o1-mini
    params:
      openai_api_key: ${ secrets:OPENAI_API_KEY }

  - from: openai:o3-mini
    name: o3-mini
    params:
      openai_api_key: ${ secrets:OPENAI_API_KEY }
      tools: auto
