name: Release

on:
  push:
    branches:
      - trunk
    paths:
      - ".changeset/**"
      - ".github/workflows/release.yaml"
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

# npm trusted publishing (OIDC) needs id-token: write.
# changesets/action needs contents and pull-requests write to open the "Version Packages" PR.
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Must match the environment in the npm trusted publisher settings.
    environment: npm
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5.1.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v5.0.0
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm i

      # Trusted publishing needs npm >= 11.5.1.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Verify npm version
        run: npm --version

      # changesets/action v2 targets @changesets/cli v3 and does not write an .npmrc.
      # `changeset publish` calls `npm publish`, which authenticates with OIDC.
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          version-script: npm run ci:version
          publish-script: npm run ci:release
